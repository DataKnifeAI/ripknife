name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    env:
      # Keep path defaults under the workspace (avoids /mnt/game1 host defaults).
      VIDEOSRIPPER_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check videosripper/ tests/

      - name: Pytest
        run: |
          mkdir -p .pytest-tmp
          pytest tests/ -v --tb=short
          rm -rf .pytest-tmp
